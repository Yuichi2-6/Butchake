<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740">
  <rect width="960" height="740" fill="#eef1f4"/>
  <rect x="0" y="520" width="960" height="220" fill="#dfe6ea"/>

  <!-- house body -->
  <rect x="220" y="300" width="420" height="260" fill="#f5f3ee" stroke="#17324f" stroke-width="4"/>
  <path d="M190 300 L430 140 L670 300 Z" fill="#17324f"/>

  <!-- freshly painted wall section -->
  <rect x="220" y="300" width="210" height="260" fill="#f4b183" opacity="0.55"/>

  <!-- windows -->
  <rect x="260" y="360" width="70" height="70" fill="#17324f" opacity="0.85"/>
  <rect x="520" y="360" width="70" height="70" fill="#17324f" opacity="0.85"/>

  <!-- door -->
  <rect x="400" y="440" width="80" height="120" fill="#d1652e"/>

  <!-- scaffolding lines -->
  <g stroke="#17324f" stroke-width="3" opacity="0.35">
    <line x1="200" y1="280" x2="200" y2="600"/>
    <line x1="680" y1="280" x2="680" y2="600"/>
    <line x1="200" y1="380" x2="680" y2="380"/>
    <line x1="200" y1="480" x2="680" y2="480"/>
  </g>

  <!-- paint roller -->
  <g transform="translate(700,430) rotate(-30)">
    <rect x="0" y="0" width="120" height="34" rx="6" fill="#d1652e"/>
    <rect x="52" y="34" width="10" height="90" fill="#3a3f45"/>
    <rect x="40" y="118" width="34" height="14" rx="4" fill="#3a3f45"/>
  </g>

  <!-- paint drips -->
  <circle cx="760" cy="560" r="10" fill="#d1652e" opacity="0.6"/>
  <circle cx="790" cy="590" r="6" fill="#d1652e" opacity="0.5"/>
</svg>
